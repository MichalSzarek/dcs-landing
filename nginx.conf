server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /about {
        try_files /about.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /briefcaster {
        try_files /briefcaster.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /maths {
        try_files /maths.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /contact {
        try_files /contact.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Polish product page + press kit.
    location = /briefcaster/pl {
        try_files /briefcaster-pl.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /press {
        try_files /press.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Briefcaster legal/support pages (linked from the app + App Store Connect).
    location = /briefcaster/privacy {
        try_files /briefcaster-privacy.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /briefcaster/terms {
        try_files /briefcaster-terms.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /briefcaster/support {
        try_files /briefcaster-support.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
